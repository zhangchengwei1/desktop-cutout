[package]
name = "cutout-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
coreml-probe = ["ort/coreml"]

[dependencies]
dirs = "6"
serde.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "dds", "pnm", "qoi", "ff"] }
sha2 = "0.10"
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
tempfile = "3"
moxcms = "0.8.1"
png = "0.18.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
libloading = "0.9"

[dev-dependencies]
flate2 = "1"
